<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="rays" x="0" y="0" width="200" height="200" patternUnits="userSpaceOnUse">
      <!-- Radiating lines from center -->
      <line x1="100" y1="100" x2="200" y2="0" stroke="white" stroke-width="1.5" opacity="0.3"/>
      <line x1="100" y1="100" x2="200" y2="40" stroke="white" stroke-width="1" opacity="0.2"/>
      <line x1="100" y1="100" x2="200" y2="80" stroke="white" stroke-width="1.5" opacity="0.3"/>
      <line x1="100" y1="100" x2="200" y2="120" stroke="white" stroke-width="1" opacity="0.2"/>
      <line x1="100" y1="100" x2="200" y2="160" stroke="white" stroke-width="1.5" opacity="0.3"/>
      <line x1="100" y1="100" x2="200" y2="200" stroke="white" stroke-width="1" opacity="0.2"/>
      <line x1="100" y1="100" x2="160" y2="200" stroke="white" stroke-width="1.5" opacity="0.3"/>
      <line x1="100" y1="100" x2="120" y2="200" stroke="white" stroke-width="1" opacity="0.2"/>
      <line x1="100" y1="100" x2="80" y2="200" stroke="white" stroke-width="1.5" opacity="0.3"/>
      <line x1="100" y1="100" x2="40" y2="200" stroke="white" stroke-width="1" opacity="0.2"/>
      <line x1="100" y1="100" x2="0" y2="200" stroke="white" stroke-width="1.5" opacity="0.3"/>
      <line x1="100" y1="100" x2="0" y2="160" stroke="white" stroke-width="1" opacity="0.2"/>
      <line x1="100" y1="100" x2="0" y2="120" stroke="white" stroke-width="1.5" opacity="0.3"/>
      <line x1="100" y1="100" x2="0" y2="80" stroke="white" stroke-width="1" opacity="0.2"/>
      <line x1="100" y1="100" x2="0" y2="40" stroke="white" stroke-width="1.5" opacity="0.3"/>
      <line x1="100" y1="100" x2="0" y2="0" stroke="white" stroke-width="1" opacity="0.2"/>
      <line x1="100" y1="100" x2="40" y2="0" stroke="white" stroke-width="1.5" opacity="0.3"/>
      <line x1="100" y1="100" x2="80" y2="0" stroke="white" stroke-width="1" opacity="0.2"/>
      <line x1="100" y1="100" x2="120" y2="0" stroke="white" stroke-width="1.5" opacity="0.3"/>
      <line x1="100" y1="100" x2="160" y2="0" stroke="white" stroke-width="1" opacity="0.2"/>
    </pattern>
  </defs>
  <rect width="200" height="200" fill="url(#rays)"/>
</svg>
